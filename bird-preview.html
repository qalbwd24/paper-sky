<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>扇尾墨羽 · 外形预览</title>
<style>body{margin:0;background:#eeeade;color:#35372f;font:16px system-ui}canvas{display:block;width:100vw;height:100vh;touch-action:none}header{position:absolute;top:30px;left:36px;pointer-events:none}h1{font:32px serif;letter-spacing:.18em;margin:8px 0}p{opacity:.65;font-size:13px}nav{position:absolute;bottom:32px;left:0;right:0;text-align:center}button,a{display:inline-block;border:1px solid #aaa99b;background:#f7f4e9dd;border-radius:30px;padding:10px 20px;margin:4px;color:inherit;text-decoration:none;font:14px system-ui;cursor:pointer}button[aria-pressed=true]{background:#393d33;color:#eeeade}</style>
<header><p>风过纸翼 / 墨羽新形</p><h1>宽翼，扇尾，墨色流动。</h1><p>拖动画面旋转视角 · 滚轮缩放</p></header><canvas id="view" aria-label="可旋转的水墨鸟模型预览"></canvas>
<nav><button data-pose="glide" aria-pressed="true">展翼滑翔</button><button data-pose="climb">爬升振翅</button><button data-pose="dive">俯冲收翼</button><button data-pose="turn">转弯倾斜</button><button id="backdrop">换背景看透明</button><a href="planet.html">进入星球</a></nav>
<script src="vendor/three.min.js"></script><script src="ink-bird.js"></script><script>
const canvas=document.getElementById('view'),renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();scene.background=new THREE.Color('#eeeade');const camera=new THREE.PerspectiveCamera(38,1,.001,10),bird=createInkBird();bird.group.visible=true;scene.add(bird.group);
let azimuth=0,elevation=1.02,radius=.52,drag=false,lastX=0,lastY=0,pose='glide',last=0;
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}resize();addEventListener('resize',resize);
canvas.onpointerdown=e=>{drag=true;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId)};canvas.onpointerup=()=>drag=false;canvas.onpointermove=e=>{if(!drag)return;azimuth-=(e.clientX-lastX)*.007;elevation=THREE.MathUtils.clamp(elevation+(e.clientY-lastY)*.007,-1.45,1.55);lastX=e.clientX;lastY=e.clientY};canvas.onwheel=e=>{e.preventDefault();radius=THREE.MathUtils.clamp(radius*Math.exp(e.deltaY*.001),.28,1.1)};
document.querySelectorAll('[data-pose]').forEach(b=>b.onclick=()=>{pose=b.dataset.pose;document.querySelectorAll('[data-pose]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});
let backdrop=0;document.getElementById('backdrop').onclick=()=>{backdrop=(backdrop+1)%3;scene.background.set(['#eeeade','#85a99a','#b99c87'][backdrop]);};
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.04,(now-last)/1000||.016);last=now;bird.update(dt,{pitch:pose==='climb'?.36:pose==='dive'?-.7:0,bank:pose==='turn'?.7:0,active:true});bird.group.rotation.z+=( (pose==='turn'?.45:0)-bird.group.rotation.z)*(1-Math.exp(-5*dt));camera.position.set(Math.sin(azimuth)*Math.cos(elevation)*radius,Math.sin(elevation)*radius,Math.cos(azimuth)*Math.cos(elevation)*radius);camera.lookAt(0,0,0);renderer.render(scene,camera)}requestAnimationFrame(frame);
</script></html>
