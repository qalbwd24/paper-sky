<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>五层迷境 · 三维布局图</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#132735;color:#e1e7df;font-family:'Microsoft YaHei',sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}header{position:absolute;top:22px;left:25px;pointer-events:none}h1{font-weight:400;font-size:22px;letter-spacing:3px;margin:0 0 10px}p{font-size:11px;line-height:1.9;opacity:.75;margin:0}nav{position:absolute;left:25px;bottom:24px;display:flex;gap:6px;flex-wrap:wrap;max-width:80%}button{background:#233c4b;border:1px solid #637c83;color:#e2e4da;padding:9px 12px;border-radius:4px;cursor:pointer;font-size:11px}button.active{background:#d8c29b;color:#1d343e}#legend{position:absolute;right:24px;bottom:28px;font-size:10px;line-height:2.1;text-align:right;color:#b8ccc9}@media(max-width:650px){header{left:16px;top:18px}h1{font-size:17px}header p{max-width:75vw}#legend{display:none}nav{left:16px;bottom:16px}button{padding:7px;font-size:10px}}</style></head><body><canvas id="map"></canvas><header><h1>五层迷境 / 空间航图</h1><p>拖动旋转 · 滚轮缩放 · 按钮聚焦楼层<br>每层约 1.7 × 1.7 km，层高随主题变化<br>五套独立随机路网 · 曲线为真实弯道，粉色虚线为折跃捷径</p></header><nav id="nav"><button data-level="-1" class="active">总览</button></nav><div id="legend">彩色线：可飞行路线<br>方框：多层镂空地标<br>长曲线：不同方位的缓坡航道<br>粉色虚线：穿门后跨层移动</div><script src="vendor/three.min.js"></script><script src="labyrinth.js"></script><script>
const canvas=document.getElementById('map'),renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'low-power'});renderer.setPixelRatio(1);renderer.setClearColor(0x132735);const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(45,1,10,25000),plan=Labyrinth.plan(Number(new URLSearchParams(location.search).get('seed'))||73021),groups=[],connections=[],colors=[0xd9ab77,0xd6e0d3,0x67c9e5,0xe9b6bc,0xb9a4ed];
for(let l=0;l<5;l++){const group=new THREE.Group();groups.push(group);scene.add(group);const base=Labyrinth.bases[l],material=new THREE.LineBasicMaterial({color:colors[l]}),border=[[-1400,0,-1400],[1400,0,-1400],[1400,0,1400],[-1400,0,1400],[-1400,0,-1400]].map(p=>new THREE.Vector3(p[0],base,p[2]));group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(border),material));const plane=new THREE.Mesh(new THREE.PlaneGeometry(2800,2800),new THREE.MeshBasicMaterial({color:colors[l],transparent:true,opacity:.045,side:THREE.DoubleSide,depthWrite:false}));plane.rotation.x=-Math.PI/2;plane.position.y=base;group.add(plane);for(const route of plan.layers[l].routes)group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(route.curve.getSpacedPoints(30).map(p=>p.add(new THREE.Vector3(0,base,0)))),material));for(const n of plan.layers[l].nodes){const box=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(160,170,130)),material);box.position.set(n.x,n.y+base+40,n.z);group.add(box);}const button=document.createElement('button');button.textContent=(l+1)+'F '+Labyrinth.themes[l].name;button.dataset.level=l;document.getElementById('nav').append(button);}
for(const spec of plan.physical){const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints(spec.curve.getSpacedPoints(160)),new THREE.LineBasicMaterial({color:colors[spec.from]}));scene.add(line);connections.push({line,from:spec.from,to:spec.to});}
for(let i=0;i<plan.portals.length;i++){const gate=plan.portals[i],target=plan.portals[gate.target];const marker=new THREE.Mesh(new THREE.TorusGeometry(40,10,4,12),new THREE.MeshBasicMaterial({color:0xeb8ec1}));marker.position.set(gate.x,gate.y,gate.z);marker.rotation.y=gate.yaw;groups[gate.level].add(marker);if(i<gate.target){const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(gate.x,gate.y,gate.z),new THREE.Vector3(target.x,target.y,target.z)]),new THREE.LineDashedMaterial({color:0xeb8ec1,dashSize:35,gapSize:25}));line.computeLineDistances();scene.add(line);connections.push({line,from:gate.level,to:target.level});}}
let yaw=.58,pitch=.38,distance=8900,target=new THREE.Vector3(0,1400,0),drag=null;function render(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();camera.position.set(target.x+Math.sin(yaw)*Math.cos(pitch)*distance,target.y+Math.sin(pitch)*distance,target.z+Math.cos(yaw)*Math.cos(pitch)*distance);camera.lookAt(target);renderer.render(scene,camera);}
canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId);};canvas.onpointermove=e=>{if(!drag)return;yaw-=(e.clientX-drag[0])*.006;pitch=Math.max(-1.1,Math.min(1.4,pitch+(e.clientY-drag[1])*.006));drag=[e.clientX,e.clientY];render();};canvas.onpointerup=canvas.onpointercancel=()=>drag=null;canvas.onwheel=e=>{e.preventDefault();distance=Math.max(1400,Math.min(15000,distance*Math.exp(e.deltaY*.001)));render();};document.getElementById('nav').onclick=e=>{if(!e.target.dataset.level)return;const l=Number(e.target.dataset.level);document.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b===e.target));groups.forEach((g,i)=>g.visible=l<0||i===l);connections.forEach(c=>c.line.visible=l<0||c.from===l||c.to===l);target.set(0,l<0?1400:Labyrinth.bases[l]+120,0);distance=l<0?8900:6900;render();};window.onresize=render;render();
</script></body></html>
